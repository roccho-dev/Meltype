name: build

on:
  push:
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Meltype.sln -c Release

      # Meltype IME (入力欄に直接入力する TSF の DLL)。C++ なので dotnet build とは別にビルドする (x64 と x86)。
      - name: Build Meltype IME
        shell: pwsh
        run: ./native/tip/build.ps1 -Configuration Release

      - name: Test package scan failure handling
        shell: powershell
        run: .\tools\Test-WindowsPackageScan.ps1

      # Microsoft IME (日本語) や英語のスペルチェッカーが無い環境では、それらを使うテストは飛ばされる。
      - name: Test
        run: dotnet run --project src/Meltype.Tests/Meltype.Tests.csproj -c Release --no-build

  # OS に依存しない部分 (Meltype.Core) を Linux と Mac でもテストする (Mac 版・Linux 版の土台)。
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project src/Meltype.Core.Tests/Meltype.Core.Tests.csproj -c Release
      - name: Linux Unicode key mapping (without IBus)
        run: python3 linux/tests/test_virtual_key.py

  # Mozc の変換ヘルパー (native/mozc) をビルドする。初回は 30〜40 分かかるので、配布用の zip を作るとき
  # (タグ・手動実行) と、ヘルパーのソースを変えたときだけ。Bazel の結果はキャッシュして次から速くする。
  mozc:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      built: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # タグ・手動実行ならビルドする。push なら、native/mozc かこのファイルが変わったときだけ (変わっていなければ数秒で終わる)。
      - name: Check
        id: check
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || git diff --name-only "$BEFORE" "$GITHUB_SHA" -- native/mozc .github/workflows/build.yml | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "native/mozc は変わっていないので、Mozc のビルドは飛ばします。"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}
      - if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Bazelisk
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          # 版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
          $version = 'v1.29.0'
          $expected = '092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b'
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bazelbuild/bazelisk/releases/download/$version/bazelisk-windows-amd64.exe" -OutFile C:\tools\bazelisk.exe
          $actual = (Get-FileHash C:\tools\bazelisk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bazelisk のハッシュが違います: $actual" }
      - if: steps.check.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            C:\bazel-cache
            C:\mozc\src\third_party_cache
          key: mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      - name: Build Mozc helper
        if: steps.check.outputs.build == 'true'
        shell: powershell
        run: .\native\mozc\Build-MozcHelper.ps1 -MozcSource C:\mozc -Python python -Bazelisk C:\tools\bazelisk.exe -DiskCache C:\bazel-cache
      - if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mozc-helper
          path: native/mozc/bin/
          retention-days: 7

  package:
    # タグ (v0.1.0 など) を push したら、テスト版の zip を作ってリリースに添付する。
    # Actions の画面から手動で実行 (Run workflow) したら、zip を実行結果 (Artifacts) に置く。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, mozc]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - if: needs.mozc.outputs.built == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mozc-helper
          path: native/mozc/bin/
      # コード署名の証明書 (秘密 SIGN_PFX_BASE64 = .pfx を Base64 にしたもの、SIGN_PASSWORD) があれば、Build-Package.ps1 が署名する
      - name: Signing certificate
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'meltype-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "MELTYPE_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Package
        shell: powershell
        env:
          MELTYPE_SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        # タグ (v1.0.0) なら Meltype-1.0.0-windows.zip、手動実行ならテスト版の名前 (Meltype-test-<日時>.zip)
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          .\Build-Package.ps1 -Version $version
      # タグの版と、ビルドした Meltype.exe の版 (ProductVersion の + より前) が同じか。違うまま出すと、
      # 自動更新が「新しい版がある」と同じ版を取り直し続けるので、出さない。
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $expected = $env:GITHUB_REF_NAME.Substring(1)
          $actual = ((Get-Item -LiteralPath 'dist\Meltype\app\Meltype.exe').VersionInfo.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) { throw "タグの版 ($expected) と Meltype.exe の版 ($actual) が違います。src\Meltype\Meltype.csproj の <Version> を合わせてください。" }
      # 検出・検査不能の配布物は、Artifacts にもリリースにも公開しない。
      - name: Scan Windows package with Defender
        shell: powershell
        timeout-minutes: 15
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'Meltype-*.zip' -File)
          if ($packages.Count -ne 1) { throw 'Expected one Meltype-*.zip file but found ' + $packages.Count }
          .\tools\Scan-WindowsPackage.ps1 -Path @('.\dist\Meltype', $packages[0].FullName)
      # この fork の GitHub Actions でビルドしたことの証明 (gh attestation verify <zip> --repo roccho-dev/Meltype で確かめられる)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Meltype-*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltype-package
          path: dist/Meltype-*.zip
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/Meltype-*.zip
