name: fork-build

# この fork の Windows 候補をビルド・テストする。公開は fork-publish.yml が検証済みの同じ bytes を使う。
# upstream の build.yml は upstream の版のまま置き、
# この fork では Actions の設定で止める (gh workflow disable build.yml)。
on:
  push:
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - '.github/workflows/fork-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - '.github/workflows/fork-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 付ける予定のタグ (v1.2.1.2 など)。入れると、タグのときだけの版の確かめも行う (リリースは作らない)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Meltype.sln -c Release

      # Meltype IME (入力欄に直接入力する TSF の DLL)。C++ なので dotnet build とは別にビルドする (x64 と x86)。
      - name: Build Meltype IME
        shell: pwsh
        run: ./native/tip/build.ps1 -Configuration Release

      - name: Test package scan failure handling
        shell: powershell
        run: .\tools\Test-WindowsPackageScan.ps1

      # Microsoft IME (日本語) や英語のスペルチェッカーが無い環境では、それらを使うテストは飛ばされる。
      - name: Test
        run: dotnet run --project src/Meltype.Windows.Tests/Meltype.Windows.Tests.csproj -c Release --no-build
      - name: Candidate artifact contract tests
        run: |
          python -m unittest discover -s tools -p test_windows_portable.py -v
          python -m unittest discover -s tools -p test_candidate_manifest.py -v
          python -m unittest discover -s tools -p test_promotion_state.py -v

  # OS に依存しない部分 (Meltype.Core) を Linux と Mac でもテストする (Mac 版・Linux 版の土台)。
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project src/Meltype.Core.Tests/Meltype.Core.Tests.csproj -c Release
      - name: Linux Unicode key mapping (without IBus)
        run: python3 linux/tests/test_virtual_key.py

  # Mozc の変換ヘルパー (native/mozc) をビルドする。初回は 30〜40 分かかるので、配布用の zip を作るとき
  # (タグ・手動実行) と、ヘルパーのソースを変えたときだけ。Bazel の結果はキャッシュして次から速くする。
  mozc:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      built: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # タグ・手動実行ならビルドする。push なら、native/mozc かこのファイルが変わったときだけ (変わっていなければ数秒で終わる)。
      - name: Check
        id: check
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || git diff --name-only "$BEFORE" "$GITHUB_SHA" -- native/mozc .github/workflows/fork-build.yml | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "native/mozc は変わっていないので、Mozc のビルドは飛ばします。"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}
      - if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Bazelisk
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          # 版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
          $version = 'v1.29.0'
          $expected = '092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b'
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bazelbuild/bazelisk/releases/download/$version/bazelisk-windows-amd64.exe" -OutFile C:\tools\bazelisk.exe
          $actual = (Get-FileHash C:\tools\bazelisk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bazelisk のハッシュが違います: $actual" }
      - if: steps.check.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            C:\bazel-cache
            C:\mozc\src\third_party_cache
          key: mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      - name: Build Mozc helper
        if: steps.check.outputs.build == 'true'
        shell: powershell
        run: .\native\mozc\Build-MozcHelper.ps1 -MozcSource C:\mozc -Python python -Bazelisk C:\tools\bazelisk.exe -DiskCache C:\bazel-cache
      - if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mozc-helper
          path: native/mozc/bin/
          retention-days: 7

  package:
    # PR でも実配布物を検査する。タグの push でもここでは公開しない。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: [test, mozc]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - if: needs.mozc.outputs.built == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mozc-helper
          path: native/mozc/bin/
      - name: Fetch Zenzai
        shell: powershell
        run: .\native\zenzai\Get-Zenzai.ps1
      - name: Package
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath src/Meltype.Windows/Meltype.Windows.csproj)).Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          .\Build-Package.ps1 -Version $version
          .\Build-Package.ps1 -Version $version -Portable -ReuseBuild
      - name: Verify actual managed portable execution
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
        run: .\tools\Test-WindowsPortable.ps1 -Archive "dist/Meltype-$env:CANDIDATE_VERSION-windows-portable.zip" -Version $env:CANDIDATE_VERSION
      # タグの版と、ビルドした Meltype.exe の版 (ProductVersion の + より前) が同じか。違うまま出すと、
      # 自動更新が「新しい版がある」と同じ版を取り直し続けるので、出さない。
      # タグを付ける前に、手動実行の入力 tag で同じ確かめを試せる (gh workflow run fork-build.yml --ref <branch> -f tag=v1.2.1.2)。
      # shell は pwsh: Windows PowerShell 5.1 (powershell) は BOM の無いスクリプトの日本語を読み違えて構文エラーになる (v1.2.1.1)。
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $expected = $env:TAG -replace '^v', ''
          $actual = ((Get-Item -LiteralPath 'dist\Meltype\app\Meltype.exe').VersionInfo.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) { throw "タグの版 ($expected) と Meltype.exe の版 ($actual) が違います。src\Meltype.Windows\Meltype.Windows.csproj の <Version> を合わせてください。" }
      # 検出・検査不能の配布物は、Artifacts にもリリースにも公開しない。
      - name: Scan Windows package with Defender
        shell: powershell
        timeout-minutes: 15
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'Meltype-*.zip' -File)
          if ($packages.Count -ne 2) { throw 'Expected normal and portable archives but found ' + $packages.Count }
          .\tools\Scan-WindowsPackage.ps1 -Path (@('.\dist\Meltype', '.\dist\Meltype-portable') + @($packages.FullName))
      - name: Bind source and tested artifact bytes
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $commit = git rev-parse HEAD
          python tools/candidate_manifest.py create --manifest dist/windows-candidate.json --directory dist --repository $env:GITHUB_REPOSITORY --commit $commit --version $env:CANDIDATE_VERSION --kind windows
          if ($LASTEXITCODE -ne 0) { throw 'candidate source/bytes binding failed' }
      # この fork の GitHub Actions でビルドしたことの証明 (gh attestation verify <zip> --repo roccho-dev/Meltype で確かめられる)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/Meltype-*.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltype-windows-candidate
          path: |
            dist/Meltype-*.zip
            dist/windows-candidate.json
          retention-days: 30
