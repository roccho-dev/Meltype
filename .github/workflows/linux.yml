name: linux

# Linux 版 (linux/、IBus) をビルドして、テスター向けの zip を実行結果 (Artifacts) に置く。
# Actions の画面から手動で実行するか、Linux 版・Mozc のヘルパー・共通部分を変えて push したとき。タグ (v*) ならリリースにも添付する。
# Mozc のビルドは初回 30〜40 分かかるので、Bazel の結果をキャッシュして次から速くする。
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'linux/**'
      - 'native/mozc/**'
      - 'src/Meltype.Core/**'
      - 'src/Meltype.Mac.Native/**'
      - 'dictionaries/**'
      - '.github/workflows/linux.yml'

jobs:
  app:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Direct TTY transport proof (Python / POSIX PTY)
        run: python3 -m unittest discover -s linux/tty/tests -v
      # IBus のエンジン (Python) の書き間違いを、時間のかかるビルドの前に見つける
      - name: Check Python
        run: python3 -c "import ast; ast.parse(open('linux/ibus-engine-meltype', encoding='utf-8').read())"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Mozc の Linux のビルドと、NativeAOT のリンクに使うもの
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config zlib1g-dev python3 \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libibus-1.0-dev libxcb-xfixes0-dev qt6-base-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/bazel-cache
            ~/mozc/src/third_party_cache
          key: mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      # Bazelisk は版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
      - name: Bazelisk
        run: |
          mkdir -p "$HOME/tools"
          curl -fsSL -o "$HOME/tools/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $HOME/tools/bazelisk" | sha256sum -c -
          chmod +x "$HOME/tools/bazelisk"
      - name: Build Mozc helper
        run: BAZEL="$HOME/tools/bazelisk" native/mozc/build-mozc-helper.sh "$HOME/mozc" "$HOME/bazel-cache"
      - name: Build
        run: linux/build.sh
      - name: Package
        run: |
          # タグ (v1.0.0) なら Meltype-1.0.0-linux.zip、それ以外はテスト版の名前
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="Meltype-${GITHUB_REF_NAME#v}-linux.zip"; else name="Meltype-linux-test-$(date +%Y%m%d-%H%M).zip"; fi
          (cd linux/build && zip -qr "$name" Meltype-linux)
          ls -la linux/build
      - uses: actions/upload-artifact@v4
        with:
          name: meltype-linux
          path: linux/build/Meltype-*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/build/Meltype-*.zip
