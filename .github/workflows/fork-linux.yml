name: fork-linux

# この fork の Linux 版。upstream の linux.yml は upstream の版のまま置き、この fork では Actions の設定で止める
# (gh workflow disable linux.yml)。
# Linux 版 (linux/、IBus) をビルドして、テスター向けの zip を実行結果 (Artifacts) に置く。
# Actions の画面から手動で実行するか、Linux 版・Mozc のヘルパー・共通部分を変えて push したとき。タグ (v*) ならリリースにも添付する。
# Mozc のビルドは初回 30〜40 分かかるので、Bazel の結果をキャッシュして次から速くする。
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'linux/**'
      - 'native/mozc/**'
      - 'src/Meltype.Core/**'
      - 'src/Meltype.Mac.Native/**'
      - 'dictionaries/**'
      - 'tools/test-native-boundaries.py'
      - '.github/workflows/fork-linux.yml'

permissions:
  contents: read

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # タグ時の softprops/action-gh-release 用。permissions は式が使えないため常に write。
    # id-token / attestations は Linux zip の出自の証明 (actions/attest-build-provenance) 用。
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # IBus のエンジン (Python) の書き間違いを、時間のかかるビルドの前に見つける
      - name: Check Python
        run: python3 -c "import ast; ast.parse(open('linux/ibus-engine-meltype', encoding='utf-8').read())"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      # Mozc の Linux のビルドと、NativeAOT のリンクに使うもの
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config zlib1g-dev python3 python3-gi gir1.2-ibus-1.0 python3-pil fonts-noto-cjk \
            ibus dbus-x11 xvfb xauth \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libibus-1.0-dev libxcb-xfixes0-dev qt6-base-dev \
            cmake fcitx5 fcitx5-modules-dev libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Direct TTY transport, graphics and key regressions
        run: python3 -m unittest discover -s linux/tty/tests -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/bazel-cache
            ~/mozc/src/third_party_cache
          key: mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-linux-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      # Bazelisk は版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
      - name: Bazelisk
        run: |
          mkdir -p "$HOME/tools"
          curl -fsSL -o "$HOME/tools/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $HOME/tools/bazelisk" | sha256sum -c -
          chmod +x "$HOME/tools/bazelisk"
      - name: Build Mozc helper
        run: BAZEL="$HOME/tools/bazelisk" native/mozc/build-mozc-helper.sh "$HOME/mozc" "$HOME/bazel-cache"
      - name: Build
        run: linux/build.sh
      # fcitx5 のアドオンを、fcitx5 のテスト用のフロントエンドで動かす。Mozc を外した本体だけで、かなの確定と変換の候補を見る
      - name: Test fcitx5 addon
        run: |
          mkdir -p linux/build/fcitx5-native
          cp linux/build/Meltype-linux/libMeltypeNative.so linux/build/fcitx5-native/
          cmake -S linux/fcitx5 -B linux/build/fcitx5-test -DBUILD_TESTING=ON
          cmake --build linux/build/fcitx5-test
          HOME="$RUNNER_TEMP/fcitx5-home" MELTYPE_DIR="$PWD/linux/build/fcitx5-native" ctest --test-dir linux/build/fcitx5-test --output-on-failure
      - name: NativeAOT boundary tests
        run: python3 tools/test-native-boundaries.py linux/build/Meltype-linux/libMeltypeNative.so
      - name: IBus and real Mozc integration tests
        run: timeout 120 python3 linux/tests/test_integration.py linux/build/Meltype-linux
      - name: Private IBus daemon tests
        run: timeout 120 xvfb-run -a dbus-run-session -- python3 linux/tests/test_daemon.py linux/build/Meltype-linux
      - name: Same-package real NativeAOT, Mozc, PTY and candidate image transport
        run: |
          python3 -m unittest discover -s linux/build/Meltype-linux/tty/tests -v
          python3 linux/build/Meltype-linux/tty/tests/native_tty.py "$PWD/linux/build/Meltype-linux"
          python3 linux/build/Meltype-linux/tty/tests/native_display.py "$PWD/linux/build/Meltype-linux"
          python3 linux/build/Meltype-linux/tty/tests/native_proposals.py "$PWD/linux/build/Meltype-linux"
      - name: Package
        run: |
          # タグ (v1.0.0) なら Meltype-1.0.0-linux.zip、それ以外はテスト版の名前
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="Meltype-${GITHUB_REF_NAME#v}-linux.zip"; else name="Meltype-linux-test-$(date +%Y%m%d-%H%M).zip"; fi
          (cd linux/build && zip -qr "$name" Meltype-linux)
          ls -la linux/build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: runtime
        with:
          name: meltype-linux
          path: linux/build/Meltype-*.zip
          retention-days: 14
      - name: Require real KVM for bcon test
        run: test -c /dev/kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test kvm big-parallel
      - name: Same-package Native source-reference handoff through installed Apps
        run: |
          set -euo pipefail
          tools="$(nix-build linux/tty/tests/reference_tools.nix --no-out-link --extra-experimental-features 'nix-command flakes')"
          python3 linux/build/Meltype-linux/tty/tests/native_reference.py "$PWD/linux/build/Meltype-linux" "$tools"
      - name: Actual bcon NixOS VT, candidate scanout, child input and terminal recovery
        run: |
          set -o pipefail
          nix-instantiate --parse linux/tty/tests/bcon.nix > /dev/null
          nix-build linux/tty/tests/bcon.nix --argstr packagePath "$PWD/linux/build/Meltype-linux" \
            -o "$RUNNER_TEMP/meltype-bcon" --show-trace 2>&1 | tee "$RUNNER_TEMP/meltype-bcon.log"
      - name: Keep bcon scanout evidence distinct from controlled transport
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltype-bcon-${{ github.sha }}
          path: |
            ${{ runner.temp }}/meltype-bcon.log
            ${{ runner.temp }}/meltype-bcon/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish this producer's source and tested distribution identities
        env:
          MELTYPE_ARTIFACT_ID: ${{ steps.runtime.outputs.artifact-id }}
          MELTYPE_ARTIFACT_DIGEST: ${{ steps.runtime.outputs.artifact-digest }}
        run: python3 linux/tty/supply.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meltype-linux-supply-${{ github.sha }}
          path: linux/build/meltype-supply.json
          if-no-files-found: error
          retention-days: 14
      # この fork の GitHub Actions でビルドしたことの証明 (gh attestation verify <zip> --repo roccho-dev/Meltype で確かめられる)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            linux/build/Meltype-*.zip
            linux/build/meltype-supply.json
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: linux/build/Meltype-*.zip
